[project]
site_name = "McDGS"
site_description = "Monte Carlo simulation of the Direct Geometry Spectrometer (DGS) at the European Spallation Source (ESS). From McStas to S(Q,E)."
site_author = "Bing Li"
site_url = "https://bingli621.github.io/mcdgs/"
repo_url = "https://github.com/bingli621/mcdgs"
repo_name = "bingli621/mcdgs"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Bing Li"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Install and first run" = "getting-started.md" },
    { "Core concepts" = "concepts.md" },
  ] },
  { "Instruments" = [
    { "T-Rex" = [
      "instruments/trex/index.md",
      { "Technical details" = "instruments/trex/details.md" },
      { "McStas instrument file" = "instruments/trex/instr-file.md" },
      { "Parameters file" = "instruments/trex/params-file.md" },
      { "Source" ="instruments/trex/source.md" },
      { "Extraction guides" = "instruments/trex/extraction.md" },
      { "Bender" = "instruments/trex/bender-scan.md" },
      { "Beam monitor" = "instruments/trex/beam-monitor.md" },
      { "Choppers" = "instruments/trex/choppers.md" },
    ] },
  ] },
  { "How-to guides" = [
    { "Run a McStas simulation" = "how-to/run-a-simulation.md" },
    { "Simulate the choppers with tof" = "how-to/simulate-the-choppers-with-tof.md" },
    { "Read the output" = "how-to/read-the-output.md" },
    { "Add an instrument" = "how-to/add-an-instrument.md" },
  ] },
  { "Reference" = [
    { "Instrument and geometry" = "reference/core.md" },
    { "Components" = "reference/components.md" },
    { "T-Rex" = "reference/trex.md" },
    { "Samples" = "reference/samples.md" },
    { "McStas" = "reference/mcstas.md" },
    { "tof" = "reference/tof.md" },
    { "Diagnostics" = "reference/diagnostics.md" },
    { "Parameters files" = "reference/io.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/bingli621/mcdgs"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.snippets.check_paths = true  # a missing file fails the build
pymdownx.snippets.dedent_subsections = true  # a section from inside a function starts at column 0
pymdownx.superfences = {}

[project.plugins.glightbox]  # click an image to open it full size, and zoom in on it

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
extensions = ["scripts/griffe_sphinx_roles.py"]
docstring_style = "numpy"
docstring_section_style = "list"
filters = "public"
heading_level = 2
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_root_heading = true
show_root_full_path = false
show_signature_annotations = true
show_source = true
show_symbol_type_heading = true
show_symbol_type_toc = true
signature_crossrefs = true
summary = true
