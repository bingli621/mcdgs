  { "CSPEC" = [
    { "Overview" = "instruments/cspec/index.md" },
    { "Technical details" = "instruments/cspec/details.md" },
    { "McStas instrument file" = "instruments/cspec/instr-file.md" },
    { "Source" = "instruments/cspec/source.md" },
    { "Guide transmission" = "instruments/cspec/guides.md" },
    { "Beam monitor" = "instruments/cspec/beam-monitor.md" },
    { "Choppers" = "instruments/cspec/choppers.md" },
    { "Time-distance diagram" = "instruments/cspec/time-distance.md" },
    { "Neutrons on sample" = "instruments/cspec/neutrons-on-sample.md" },
    { "Masked source" = "instruments/cspec/masked-source.md" },
    { "Incident energy" = "instruments/cspec/incident-energy.md" },
    { "Elastic resolution (short wavelength)" = "instruments/cspec/elastic-resolution-incoherent-short.md" },
    { "Elastic resolution (long wavelength)" = "instruments/cspec/elastic-resolution-incoherent-long.md" },
    { "Diffraction" = "instruments/cspec/diffraction.md" },
    { "Diffraction scan" = "instruments/cspec/diffraction-scan.md" },
    { "Powder magnon" = "instruments/cspec/magnon-powder.md" },
  ] },
  { "How-to guides" = [
    { "Run a McStas simulation" = "how-to/run-a-simulation.md" },
    { "Run McStasScript's diagnostics" = "how-to/run-mcstasscript-diagnostics.md" },
