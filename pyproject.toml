[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcdgs"
version = "0.1.0"
description = "Monte Carlo simulation of the Direct Geometry Spectrometer (DGS) at the European Spallation Source (ESS). From McStas to S(Q,E)."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
authors = [{ name = "Bing Li", email = "bing.li@ess.eu" }]
dependencies = [
    "h5py>=3.16",
    "matplotlib>=3.11.2",
    "mcstasscript>=0.0.96,<0.0.97",
    "mcstastox @ git+https://github.com/mads-bertelsen-agentic/McStasToX@af80792680397168f5fd185afa392116bd4cf848",
    "numpy>=2.5",
    "pyyaml>=6.0.3,<7",
    "scipp>=26.9.0",
    "scippneutron>=26.10.0",
    "scipy>=1.18",
    "tabulate>=0.10.0,<0.11",
]

[project.optional-dependencies]
test = ["pytest>=9.2.0", "pytest-cov>=7.1.0"]

[tool.hatch.metadata]
# mcstastox is not on PyPI; it is pinned to a git commit
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mcdgs"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"  # the Examples in the docstrings are tests too

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# numpydoc docstrings and type hints, for the package (not the tests, scripts and diagnosis)
extend-select = ["D", "ANN"]
ignore = [
    "ANN401",  # Any: params is any params_class, values may be anything
    "D105",  # magic methods: a docstring only where they do something unusual
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"scripts/**" = ["D", "ANN"]
"diagnosis/**" = ["D", "ANN"]
