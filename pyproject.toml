[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcdgs"
version = "0.1.0"
description = "Monte Carlo simulation of the Direct Geometry Spectrometer (DGS) at the European Spallation Source (ESS). From McStas to S(Q,E)."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
authors = [{ name = "Bing Li", email = "bing.li@ess.eu" }]
dependencies = [
    "h5py",
    "matplotlib",
    "mcstasscript",
    "mcstastox @ git+https://github.com/mads-bertelsen-agentic/McStasToX@af80792680397168f5fd185afa392116bd4cf848",
    "numpy",
    "pyyaml",
    "scipp>=26.9.0,<27",
    "scippneutron>=26.10.0,<27",
    "scipy",
    "tabulate>=0.10.0,<0.11",
    "tof>=26.10.0,<27",
]

[project.optional-dependencies]
test = ["pytest>=9.2.0,<10", "pytest-cov>=7.1.0,<8"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [{ name = "macos-arm64", platform = "osx-arm64", macos = "14.0" }, "linux-64"]  # scipp 26 needs macOS 14

# only what [project] does not list: pixi also installs [project.dependencies],
# taking a package from conda-forge when McStas already brings it, else from PyPI
[tool.pixi.dependencies]
python = "3.14.*"  # the version McStas brings, pinned so that the docs, without McStas, match
pre-commit = ">=4.7.0,<5"
ruff = ">=0.17.3,<0.18"
mypy = ">=2.4.1,<3"
types-pyyaml = ">=6.0.12.20261103,<7"
types-tabulate = ">=0.10.0.20261006,<0.11"

[tool.pixi.pypi-dependencies]
mcdgs = { path = ".", editable = true }

# McStas, and the 3D view, interactive plots and batch runs of the notebooks
[tool.pixi.feature.mcstas.dependencies]
mcstas = ">=3.10.2,<4"
pythreejs = ">=2.4.2,<3"
ipympl = ">=0.10.0,<0.11"
nbconvert-core = ">=7.17.2,<8"  # for docs-mcstas, which runs the notebooks

[tool.pixi.feature.docs.tasks]
# the figures and results that need only mcdgs and tof, made fresh for every build
docs-generate = "python scripts/docs_generated.py"
docs = { cmd = "zensical serve", depends-on = ["docs-generate"] }
docs-build = { cmd = "zensical build --clean --strict", depends-on = ["docs-generate"] }

[tool.pixi.feature.docs.dependencies]
zensical = ">=0.0.73,<0.0.74"
mkdocstrings-python = ">=2.0.10,<3"

[tool.pixi.feature.mcstas.tasks]
# the figures and files of the T-Rex page that need McStas: run by hand when the instrument
# changes, then commit. The figures of bender.ipynb come from long scans and are saved by hand.
docs-mcstas = "jupyter nbconvert --to notebook --execute --inplace notebooks/trex/overview.ipynb"

[tool.pixi.environments]
default = ["test", "mcstas"]  # test: pytest and pytest-cov, from [project.optional-dependencies]
# mcdgs and tof, to make the generated figures, but no McStas
docs = ["docs"]

[tool.hatch.metadata]
# mcstastox is not on PyPI; it is pinned to a git commit
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mcdgs"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"  # the Examples in the docstrings are tests too

[tool.mypy]
# scipp, tof, mcstasscript and friends ship no stubs; check our code, not theirs
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# numpydoc docstrings and type hints, for the package (not the tests, scripts and notebooks)
extend-select = ["D", "ANN"]
ignore = [
    "ANN401",  # Any: params is any params_class, values may be anything
    "D105",  # magic methods: a docstring only where they do something unusual
]

[tool.ruff.lint.flake8-bugbear]
# param returns a dataclasses.field, as safe a dataclass default (RUF009) as field itself
extend-immutable-calls = ["mcdgs.core.params.param"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"scripts/**" = ["D", "ANN"]
"notebooks/**" = ["D", "ANN"]
