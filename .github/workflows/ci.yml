name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v0.8 read pyproject.toml with a TOML 0.5 parser, which rejects its platforms list
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.0  # the version that wrote pixi.lock
          locked: true
          cache: true
      - run: pixi run pytest -q --cov=mcdgs --cov-report=term-missing
      - name: Coverage in job summary
        run: pixi run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
