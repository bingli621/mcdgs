[workspace]
authors = ["Bing Li <bing.li@ess.eu>"]
channels = ["conda-forge"]
name = "mcdgs"
platforms = [{ name = "macos-arm64", platform = "osx-arm64", macos = "14.0" }, "linux-64"]  # scipp 26 needs macOS 14
version = "0.1.0"

[tasks]

[dependencies]
mcstas = ">=3.10.1,<4"
mcstasscript = ">=0.0.96,<0.0.97"
scipp = ">=26.9.0,<27"
pytest = ">=9.2.0,<10"
scippneutron = ">=26.10.0,<27"
matplotlib = ">=3.11.2,<4"
pytest-cov = ">=7.1.0,<8"
pyyaml = ">=6.0.3,<7"
pre-commit = ">=4.7.0,<5"
tabulate = ">=0.10.0,<0.11"
numpy = ">=2.5"
scipy = ">=1.18"
h5py = ">=3.16"
ruff = ">=0.17.3,<0.18"

[pypi-dependencies]
mcdgs = { path = ".", editable = true }
mcstastox = { git = "https://github.com/mads-bertelsen-agentic/McStasToX", rev = "af80792680397168f5fd185afa392116bd4cf848" }

[feature.docs.tasks]
docs = "zensical serve"
docs-build = "zensical build --clean --strict"

[feature.docs.dependencies]
zensical = ">=0.0.73,<0.0.74"
mkdocstrings-python = ">=2.0.10,<3"

[environments]
# the API pages read the source without importing it, so the site needs no McStas
docs = { features = ["docs"], no-default-feature = true }
